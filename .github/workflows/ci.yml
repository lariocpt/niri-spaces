  #   runs-on: ubuntu-latest
  #   steps:
  #     - uses: actions/checkout@v4
  #     - name: The installer we serve is the installer we reviewed
  #       run: |
  #         set -euo pipefail
  #         curl -fsSL "$NIRI_SPACES_INSTALLER_URL" -o served.sh
  #         cmp install.sh served.sh
  #     - name: The pinned release still verifies end to end
  #       run: |
  #         set -euo pipefail
  #         sh install.sh --tag="$NIRI_SPACES_PINNED_TAG" --dry-run
