name: ci

# Two paths to main get gated: a push to it, and a pull request aimed at it.
# Nothing else triggers this on purpose — a workflow that also fired on every
# throwaway branch would spend minutes CI has no reason to spend on a branch
# nobody can release from.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # The newest push is the only one that matters. Nothing in here has a side
  # effect to roll back, so letting a superseded run finish is just noise about a
  # commit that is no longer the tip of the branch every release is cut from.
  cancel-in-progress: true

jobs:
  # Gate 1: every shell line the project ships or runs parses as the shell it
  # claims, and is clean under shellcheck. This is a bash CLI whose installer is
  # executed by `curl | sh` on a stranger's machine — the class of bug worth a
  # standing gate is the bash-ism that runs on the author's box and dies on the
  # dash/ash host that actually did the curl.
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the linter
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck

      - name: The installer means its #!/bin/sh
        run: |
          set -euo pipefail
          # install.sh is piped straight to a stranger's /bin/sh with no developer in
          # the loop, so "it works in bash" proves nothing. Parse it under /bin/sh and
          # lint it AS sh: on the runner /bin/sh is dash, and shellcheck -s sh flags the
          # GNU-isms (arrays, [[ ]], local) that would parse in bash and die on the
          # dash/ash/busybox host that actually ran the curl.
          sh -n docs/install.sh
          shellcheck -s sh docs/install.sh

      - name: The CLI and the test harness are clean
        run: |
          set -euo pipefail
          # -x follows the sourced helper files, so a bug in the harness is caught at
          # the helper and not only where a spec happens to call it. The fake-niri and
          # winapp stubs are linted too — a stub that quietly mis-logs an argv turns a
          # real regression green.
          bash -n niri-spaces
          shellcheck -x niri-spaces
          shellcheck -x tests/helpers/setup.bash tests/helpers/stubs/niri tests/helpers/stubs/winapp

      - name: The Python tools compile
        run: |
          set -euo pipefail
          # space-splash and the site tooling are Python 3, not shell, so shellcheck
          # cannot read them. Byte-compiling each catches a syntax error a reviewer
          # would otherwise only hit by running the splash or the docs gate.
          python3 -m py_compile space-splash niri-terminal-pairs
          python3 -m py_compile tools/gen-showcase.py tools/check-site.py

  # Gate 2: the behavioural suite. It is the only thing that says a space still
  # loads the way the window-diff, the resolution order and the installer's
  # verify-before-write rules require, and it is hermetic by construction: it
  # fakes niri and every GUI app and borrows only the real jq from the runner, so
  # it needs no compositor and no Wayland session and cannot drift against a host.
  test:
    name: bats
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install jq and bats-core
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq jq
          # The CLI hard-requires a real jq, so the suite needs one; niri stays faked.
          # apt ships a bats older than BATS_TEST_TMPDIR (bats-core 1.5), which every
          # temp the suite creates hangs off, so install bats-core from source.
          git clone --depth 1 https://github.com/bats-core/bats-core.git /tmp/bats-core
          sudo /tmp/bats-core/install.sh /usr/local
          bats --version

      - name: Run the suite
        run: |
          bats tests/
          python3 -m unittest discover -s tests -p "test_*.py" -v

  # Gate 3: the docs page. It is the front door every `curl | sh` reader passes
  # through, so it is gated like code: the generator that draws the hero must
  # reproduce the committed bytes exactly (--check), and a checker must prove the
  # page makes no claim the CLI can't back up and loads nothing from the network.
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Regenerate the hero showcase and prove it is committed
        run: python3 tools/gen-showcase.py --check

      - name: The page matches the CLI and loads nothing external
        run: python3 tools/check-site.py

  # ---------------------------------------------------------------------------
  # SERVED-BYTES GATE — deliberately NOT enabled here. The check below proves the
  # bytes a `curl | sh` reader runs are the bytes this repo reviewed, but it can
  # only exist once Pages actually serves docs/install.sh and release.yml
  # publishes a pinned tag. Until both do, the URLs below are empty and a green
  # "pass" would certify a thing that does not exist. It belongs in the Pages
  # pipeline (pages.yml), next to the deploy it guards — not as a CI job whose
  # whole value is a comparison against a URL that 404s. Enable it there when the
  # first Pages deploy lands, not before.
  # ---------------------------------------------------------------------------
  #   curl -fsSL "$NIRI_SPACES_INSTALLER_URL" -o served.sh && cmp docs/install.sh served.sh
  #   sh docs/install.sh --tag="$NIRI_SPACES_PINNED_TAG" --dry-run
